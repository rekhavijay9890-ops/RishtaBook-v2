plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.rishtabook"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.rishtabook.online"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        debug {
            // Pinned, checked-in debug keystore (android/app/debug.keystore) so
            // every build environment (CI, any Codespace, any dev machine)
            // signs debug/release-via-debug builds with the SAME certificate.
            // Without this, Gradle auto-generates a new random debug keystore
            // per machine, which breaks Google Sign-In (its SHA-1 fingerprint
            // must be registered in Firebase Console, and a moving fingerprint
            // can never stay registered). This is a debug-only key - it's
            // fine for it to live in source control.
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            // This app has no native/C++ code of its own - the only reason
            // AGP wants the NDK at all is to strip debug symbols from the
            // prebuilt .so libraries that dependencies (Firebase etc.) ship.
            // Skipping that stripping step removes the NDK requirement
            // entirely, which matters on disk/bandwidth-constrained build
            // machines where downloading the multi-hundred-MB NDK package
            // isn't practical for a debug build.
            keepDebugSymbols += ["**/*.so"]
        }
    }
}

flutter {
    source = "../.."
}
