name: rishtabook
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.3.1
  font_awesome_flutter: 10.7.0
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^6.2.1
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  
flutter:
  uses-material-design: true

  assets:
  - assets/icon.png
