name: rishtabook
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.3.1
  font_awesome_flutter: 10.7.0
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^6.2.1
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  firebase_storage: ^13.4.5
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  razorpay_flutter: ^1.4.0
  google_mobile_ads: ^7.0.0
  video_player: ^2.9.2
  supabase_flutter: ^2.17.1
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  
flutter:
  uses-material-design: true

  assets:
  - assets/icon.png
  - assets/video/signin_bg.mp4
