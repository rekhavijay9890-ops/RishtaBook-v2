<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RishtaBook — Admin Dashboard</title>
<style>
  :root {
    --bg: #FAF7FD; --surface: #FFFFFF; --ink: #2B2438; --muted: #6B5E7B; --ghost: #8A7B99;
    --border: #EBE1F7; --accent: #7C4DBF; --accent-dark: #5A3690; --accent-light: #F1E9FB;
    --success: #1E7A4C; --error: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .topbar {
    background: linear-gradient(135deg, #6B5E88, #7C4DBF); color: #fff;
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 800; }
  .topbar .sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
  .topbar button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .topbar button:hover { background: rgba(255,255,255,0.25); }

  #loginScreen {
    max-width: 380px; margin: 80px auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; text-align: center;
  }
  #loginScreen h2 { margin: 0 0 4px; }
  #loginScreen p.tag { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  #loginScreen input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; background: var(--bg);
  }
  #loginScreen input:focus { outline: none; border-color: var(--accent); }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-outline { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--ghost); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  #loginError { color: var(--error); font-size: 12.5px; margin-top: 12px; min-height: 16px; }

  #dashboard { display: none; padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 220px; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: 100px; font-size: 13px; background: var(--surface);
  }
  .toolbar input[type="search"]:focus { outline: none; border-color: var(--accent); }
  .stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; min-width: 120px;
  }
  .stat-card .v { font-size: 20px; font-weight: 800; color: var(--accent); }
  .stat-card .l { font-size: 11px; color: var(--ghost); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--ghost); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--accent-light);
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tbody tr:hover { background: var(--accent-light); }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700;
  }
  .pill-verified { background: #E0F5F2; color: #0F7C6E; }
  .pill-pending { background: #FBF0DC; color: #B07A1E; }
  .pill-none { background: var(--border); color: var(--ghost); }
  .credits { font-weight: 800; color: var(--accent); }
  .row-actions button {
    padding: 5px 10px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--accent);
    background: #fff; color: var(--accent); cursor: pointer; font-weight: 700;
  }
  .row-actions button:hover { background: var(--accent-light); }
  #tableWrap { overflow-x: auto; }
  .empty { text-align: center; padding: 40px; color: var(--ghost); }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(43,36,56,0.45);
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    background: #fff; border-radius: 14px; padding: 24px; width: 320px;
  }
  .modal h3 { margin: 0 0 4px; font-size: 15px; }
  .modal p { margin: 0 0 16px; font-size: 12.5px; color: var(--muted); }
  .modal label { font-size: 11.5px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 4px; }
  .modal input, .modal select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 13px; margin-bottom: 14px; background: var(--bg);
  }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 100px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>RishtaBook Admin</h2>
  <p class="tag">Sign in with the account configured as admin</p>
  <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
  <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
  <button class="btn btn-primary" onclick="signInEmail()">Sign in</button>
  <div class="divider">or</div>
  <button class="btn btn-outline" onclick="signInGoogle()">Continue with Google</button>
  <div id="loginError"></div>
</div>

<div id="dashboard">
  <div class="stat-row" id="statRow"></div>
  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="Search name, mobile, email, city..." oninput="renderTable()" />
    <button class="btn btn-outline" style="width:auto;" onclick="downloadCsv()">⬇ Download CSV</button>
  </div>
  <div id="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Mobile</th><th>Email</th><th>Religion / Caste</th>
          <th>Location</th><th>Verified</th><th>Credits</th><th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none;">No users found.</div>
  </div>
</div>

<div class="modal-backdrop" id="grantModal">
  <div class="modal">
    <h3>Grant credits</h3>
    <p id="grantTarget"></p>
    <label>Amount</label>
    <input type="number" id="grantAmount" placeholder="e.g. 100" min="1" />
    <label>Reason (shown to the user)</label>
    <input type="text" id="grantLabel" placeholder="e.g. Customer support goodwill" />
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeGrantModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitGrant()">Grant</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  // Same Firebase project as the RishtaBook app (lib/main.dart) — this
  // config is public-by-design (Firebase's equivalent of a client id, not
  // a secret); real access control is enforced by firestore.rules, which
  // only lets ADMIN_EMAIL below write credits/transactions for other users.
  const firebaseConfig = {
    apiKey: "AIzaSyBlScDXJDv6P6kcR6c5FUyWxT_LAyucduE",
    authDomain: "rishtabook-60663.firebaseapp.com",
    projectId: "rishtabook-60663",
    storageBucket: "rishtabook-60663.firebasestorage.app",
    messagingSenderId: "838898779560",
    appId: "1:838898779560:android:14edeacd3f6af2b853099d",
  };
  const ADMIN_EMAIL = "rekhavijay9890@gmail.com";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allUsers = [];
  let grantTargetUid = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function signInEmail() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginError').textContent = '';
    auth.signInWithEmailAndPassword(email, password).catch(e => {
      document.getElementById('loginError').textContent = e.message;
    });
  }

  function signInGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    document.getElementById('loginError').textContent = '';
    auth.signInWithPopup(provider).catch(e => {
      document.getElementById('loginError').textContent = e.message;
    });
  }

  auth.onAuthStateChanged(user => {
    if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadUsers();
    } else if (user) {
      document.getElementById('loginError').textContent = 'This account is not the configured admin account.';
      auth.signOut();
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function loadUsers() {
    db.collection('users').onSnapshot(snap => {
      allUsers = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
      renderStats();
      renderTable();
    }, err => showToast('Failed to load users: ' + err.message));
  }

  function renderStats() {
    const total = allUsers.length;
    const verified = allUsers.filter(u => u.isVerified).length;
    const pending = allUsers.filter(u => u.verificationStatus === 'pending').length;
    const totalCredits = allUsers.reduce((s, u) => s + (Number(u.credits) || 0), 0);
    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="v">${total}</div><div class="l">Total users</div></div>
      <div class="stat-card"><div class="v">${verified}</div><div class="l">Verified</div></div>
      <div class="stat-card"><div class="v">${pending}</div><div class="l">Pending verification</div></div>
      <div class="stat-card"><div class="v">${totalCredits}</div><div class="l">Credits in circulation</div></div>
    `;
  }

  function esc(s) {
    return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function matches(u, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return [u.fullName, u.mobile, u.email, u.location, u.village, u.district, u.state]
      .some(f => (f || '').toString().toLowerCase().includes(q));
  }

  function renderTable() {
    const q = document.getElementById('searchBox').value.trim();
    const rows = allUsers.filter(u => matches(u, q));
    const body = document.getElementById('tableBody');
    document.getElementById('emptyState').style.display = rows.length ? 'none' : 'block';
    body.innerHTML = rows.map(u => {
      const verPill = u.isVerified
        ? '<span class="pill pill-verified">Verified</span>'
        : u.verificationStatus === 'pending'
          ? '<span class="pill pill-pending">Pending</span>'
          : '<span class="pill pill-none">—</span>';
      return `<tr>
        <td>${esc(u.fullName || 'N/A')}</td>
        <td>${esc(u.mobile || '—')}</td>
        <td>${esc(u.email || '—')}</td>
        <td>${esc(u.religion || '—')}${u.caste ? ' · ' + esc(u.caste) : ''}</td>
        <td>${esc(u.location || [u.village, u.district, u.state].filter(Boolean).join(', '))}</td>
        <td>${verPill}</td>
        <td class="credits">${Number(u.credits) || 0}</td>
        <td class="row-actions"><button onclick="openGrantModal('${u.uid}','${esc(u.fullName || u.email || u.uid).replace(/'/g, "\\'")}')">Grant credits</button></td>
      </tr>`;
    }).join('');
  }

  function openGrantModal(uid, name) {
    grantTargetUid = uid;
    document.getElementById('grantTarget').textContent = 'To: ' + name;
    document.getElementById('grantAmount').value = '';
    document.getElementById('grantLabel').value = '';
    document.getElementById('grantModal').style.display = 'flex';
  }
  function closeGrantModal() {
    document.getElementById('grantModal').style.display = 'none';
    grantTargetUid = null;
  }

  async function submitGrant() {
    const amount = parseInt(document.getElementById('grantAmount').value, 10);
    const label = document.getElementById('grantLabel').value.trim() || 'Admin grant';
    if (!grantTargetUid || !amount || amount <= 0) {
      showToast('Enter a valid amount');
      return;
    }
    const userRef = db.collection('users').doc(grantTargetUid);
    try {
      await userRef.update({ credits: firebase.firestore.FieldValue.increment(amount) });
      await userRef.collection('transactions').add({
        type: 'admin_grant', delta: amount, label,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await userRef.collection('notifications').add({
        type: 'credit', title: 'क्रेडिट मिला / Credits added',
        body: `+${amount} credits · ${label}`,
        meta: { amount, label }, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      showToast(`Granted ${amount} credits`);
      closeGrantModal();
    } catch (e) {
      showToast('Failed: ' + e.message);
    }
  }

  function downloadCsv() {
    const headers = ['Full Name','DOB','Gender','Mobile','Email','Religion','Caste','Category','Location','Occupation','Verified','Verification Status','Credits'];
    const escCsv = v => '"' + (v ?? '').toString().replace(/"/g, '""') + '"';
    const rows = [headers.map(escCsv).join(',')];
    allUsers.forEach(u => {
      rows.push([
        u.fullName, u.dob, u.gender, u.mobile, u.email, u.religion, u.caste, u.category,
        u.location || [u.village, u.district, u.state].filter(Boolean).join(', '),
        u.occupation, u.isVerified ? 'Yes' : 'No', u.verificationStatus, u.credits || 0,
      ].map(escCsv).join(','));
    });
    const blob = new Blob([rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rishtabook_users_${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
