name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # --target-platform android-arm64 builds ONE architecture instead
        # of a "fat" universal APK bundling arm/arm64/x86/x86_64 native
        # libs together - arm64 alone covers virtually every real Android
        # phone made since ~2017. This is a direct-download sideload APK,
        # not a Play Store App Bundle (which would split per-ABI on its
        # own), so restricting here is what actually shrinks the file.
        run: flutter build apk --release --target-platform android-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
