name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # --target-platform android-arm64 builds ONE architecture instead
        # of a "fat" universal APK bundling arm/arm64/x86/x86_64 native
        # libs together - arm64 alone covers virtually every real Android
        # phone made since ~2017. This is a direct-download sideload APK,
        # not a Play Store App Bundle (which would split per-ABI on its
        # own), so restricting here is what actually shrinks the file.
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RishtaBook.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RishtaBook-apk
          path: build/app/outputs/flutter-apk/RishtaBook.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RishtaBook Build ${{ github.run_number }}
          make_latest: true
          body: |
            ## Download APK

            **Option 1 — Releases (recommended on phone):**
            Scroll to **Assets** at the bottom of this page and tap **RishtaBook.apk**.

            **Option 2 — Direct link:**
            https://github.com/rekhavijay9890-ops/RishtaBook-v2/releases/download/build-${{ github.run_number }}/RishtaBook.apk

            **Option 3 — Actions artifact:**
            Open the workflow run → **Artifacts** → download `RishtaBook-apk`.

            ## Install on Android
            1. Download `RishtaBook.apk`
            2. Open **Downloads** and tap the file
            3. Allow **Install unknown apps** for your browser/Files app if prompted
            4. Tap **Install**
          files: build/app/outputs/flutter-apk/RishtaBook.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
